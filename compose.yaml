name: wohp

services:
  wohp:
    build: .
    environment:
      WOHP_SERVER_ENV: development
      WOHP_SERVER_LISTEN_HOST: 0.0.0.0
      WOHP_SERVER_PUBLIC_ORIGIN: ${WOHP_SERVER_PUBLIC_ORIGIN:?set WOHP_SERVER_PUBLIC_ORIGIN}
      WOHP_CLIENT_MIN_AGE: ${WOHP_CLIENT_MIN_AGE:-16}
      WOHP_VERIFIER_URL: ${WOHP_VERIFIER_URL:?set WOHP_VERIFIER_URL}
      WOHP_VERIFIER_INTENDED_USE_ID: ${WOHP_VERIFIER_INTENDED_USE_ID:?set WOHP_VERIFIER_INTENDED_USE_ID}
      WOHP_VERIFIER_CLIENT_ID: ${WOHP_VERIFIER_CLIENT_ID:?set WOHP_VERIFIER_CLIENT_ID}
      WOHP_VERIFIER_CREDENTIAL_FORMAT: ${WOHP_VERIFIER_CREDENTIAL_FORMAT:-sd-jwt}
      WOHP_VERIFIER_PROFILE: ${WOHP_VERIFIER_PROFILE:-haip}
      WOHP_VERIFIER_RESPONSE_MODE: ${WOHP_VERIFIER_RESPONSE_MODE:-direct_post.jwt}
      WOHP_VERIFIER_REQUEST_PAN: ${WOHP_VERIFIER_REQUEST_PAN:-0}
      WOHP_SERVER_CORE_DB: /var/lib/wohp-core/identity.sqlite3
      WOHP_SERVER_CORE_KEY: /var/lib/wohp-core/lookup.key
      WOHP_SERVER_DB: /var/lib/wohp-core/server.sqlite3
      WOHP_CLIENT_ID: ${WOHP_CLIENT_ID:?set WOHP_CLIENT_ID}
      WOHP_CLIENT_SCOPE: ${WOHP_CLIENT_SCOPE:?set WOHP_CLIENT_SCOPE}
      WOHP_CLIENT_REDIRECT_URIS: ${WOHP_CLIENT_REDIRECT_URIS:?set WOHP_CLIENT_REDIRECT_URIS}
      WOHP_CLIENT_TOKEN: ${WOHP_CLIENT_TOKEN:?set WOHP_CLIENT_TOKEN}
      WOHP_BRAND_NAME: ${WOHP_BRAND_NAME:-WOHP}
      WOHP_BRAND_TAGLINE: ${WOHP_BRAND_TAGLINE:-}
      WOHP_BRAND_NOTICE: ${WOHP_BRAND_NOTICE:-}
    volumes: ["wohp_core:/var/lib/wohp-core"]
    ports: ["127.0.0.1:${WOHP_PORT:-8787}:8787"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  wohp_core:
