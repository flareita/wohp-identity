[workspace]
members = ["crates/wohp-api", "crates/wohp", "crates/wohp-mock", "crates/wohp-eudi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "EUPL-1.2"

[workspace.dependencies]
wohp-api = { path = "crates/wohp-api", version = "=0.1.0" }
wohp-mock = { path = "crates/wohp-mock", version = "=0.1.0" }
wohp-eudi = { path = "crates/wohp-eudi", version = "=0.1.0" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
ring = { version = "=0.17.14", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "fallible_uint"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "=1.53.3", default-features = false, features = ["rt", "net"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "=1.0.151"
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
unicode-normalization = { version = "=0.1.26", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
overflow-checks = true
strip = "debuginfo"
